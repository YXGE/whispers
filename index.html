<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141716">
  <title>Sevis · Whispers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%3C/text%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

    :root {
      --bg: #141716;
      --surface: #1c201e;
      --card: #222725;
      --card-hover: #283230;
      --border: #2f3533;
      --border-hover: #4a6b5a;
      --text: #c2c8c4;
      --text-secondary: #7d857f;
      --text-dim: #4d5451;
      --accent: #6b9b80;
      --accent-dim: #3d6652;
      --dot: #4a6b5a;
      --liked: #c27c6b;
      --saved: #b8a96b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Noto Serif SC", serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.025;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .page-shell {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      animation: settle .65s ease both;
    }
    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      overflow: hidden;
      color: var(--accent);
      background: var(--card);
      border: 1.5px solid var(--border-hover);
      border-radius: 50%;
    }
    .avatar svg { width: 28px; height: 28px; }
    .profile-info { display: flex; flex-direction: column; gap: 2px; }
    .profile-name {
      color: var(--text);
      font-family: "EB Garamond", serif;
      font-size: 1.15em;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .profile-sub {
      color: var(--text-dim);
      font-family: "EB Garamond", serif;
      font-size: .75em;
      font-style: italic;
      letter-spacing: .1em;
    }

    .masthead {
      margin-bottom: 72px;
      padding-bottom: 48px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      animation: settle .65s .08s ease both;
    }
    .masthead .icon { margin-bottom: 20px; font-size: 1.6em; opacity: .5; }
    .masthead h1 {
      margin-bottom: 10px;
      color: var(--text);
      font-family: "EB Garamond", serif;
      font-size: 2.2em;
      font-weight: 400;
      letter-spacing: .1em;
    }
    .masthead .tagline {
      color: var(--text-dim);
      font-family: "EB Garamond", serif;
      font-size: .88em;
      font-style: italic;
      letter-spacing: .12em;
    }

    .feed { position: relative; padding-left: 28px; }
    .feed::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 6px;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--border) 5%, var(--border) 95%, transparent);
    }
    .note {
      position: relative;
      margin-bottom: 36px;
      animation: rise .48s ease both;
    }
    .note::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 26px;
      left: -25px;
      width: 7px;
      height: 7px;
      background: var(--dot);
      border: 2px solid var(--bg);
      border-radius: 50%;
      transition: background .3s;
    }
    .note-paper {
      position: relative;
      padding: 22px 26px;
      overflow: hidden;
      color: var(--text);
      background:
        repeating-linear-gradient(2deg, rgba(194, 200, 196, .018) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(92deg, rgba(0, 0, 0, .025) 0 1px, transparent 1px 9px),
        var(--card);
      border-radius: 6px 5px 7px 4px / 5px 7px 4px 6px;
      filter: drop-shadow(2px 3px 6px rgba(0,0,0,.4)) drop-shadow(0 1px 3px rgba(0,0,0,.25));
      transition: filter .3s, background-color .3s, transform .3s;
      transform: rotate(-0.35deg);
      transform-origin: center;
    }
    .note:nth-child(odd) .note-paper { transform: rotate(-0.5deg); }
    .note:nth-child(even) .note-paper { transform: rotate(0.3deg); }
    .note:nth-child(3n) .note-paper { transform: rotate(-0.2deg); }
    .note:nth-child(5n+2) .note-paper { transform: rotate(0.45deg); }
    .note-paper::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--border), inset 0 0 24px rgba(0, 0, 0, .07);
      opacity: .9;
      transition: box-shadow .3s;
    }
    .note:hover::before { background: var(--accent); }
    .note:hover .note-paper {
      background-color: var(--card-hover);
      filter: drop-shadow(3px 6px 12px rgba(0,0,0,.5)) drop-shadow(0 2px 5px rgba(0,0,0,.3));
      transform: rotate(-0.15deg) translateY(-2px);
    }
    .note:hover .note-paper::after {
      box-shadow: inset 0 0 0 1px var(--border-hover), inset 0 0 24px rgba(0, 0, 0, .08);
    }

    .note-head { display: contents; }
    .date {
      display: inline-block;
      margin-bottom: 14px;
      padding: 2px 8px;
      color: var(--text-dim);
      border: 1px dashed var(--border);
      font-family: "EB Garamond", serif;
      font-size: .72em;
      letter-spacing: .08em;
    }
    .content {
      color: var(--text);
      font-size: .92em;
      line-height: 2;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .mood {
      display: inline-block;
      max-width: 100%;
      margin-top: 14px;
      padding: 2px 10px;
      overflow: hidden;
      color: var(--text-secondary);
      background: var(--surface);
      border-radius: 2px;
      font-family: "EB Garamond", serif;
      font-size: .72em;
      letter-spacing: .05em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-actions {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .action {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      color: var(--text-dim);
      background: none;
      border: 0;
      cursor: pointer;
      font-family: "EB Garamond", serif;
      font-size: .78em;
      letter-spacing: .04em;
      transition: color .25s, transform .16s;
      -webkit-tap-highlight-color: transparent;
    }
    .action:hover { color: var(--text-secondary); }
    .action:active { transform: scale(.94); }
    .action:focus-visible, .page-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .action svg { width: 15px; height: 15px; fill: none; transition: fill .25s, transform .25s; }
    .action.liked { color: var(--liked); }
    .action.saved { color: var(--saved); }
    .action.liked svg, .action.saved svg { fill: currentColor; }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .page-button {
      min-width: 34px;
      padding: 6px 12px;
      color: var(--text-dim);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
      font-family: "EB Garamond", serif;
      font-size: .82em;
      letter-spacing: .06em;
      transition: all .25s;
      -webkit-tap-highlight-color: transparent;
    }
    .page-button:hover:not(:disabled) { color: var(--text); background: var(--card-hover); border-color: var(--border-hover); }
    .page-button.current { color: var(--text); background: var(--accent-dim); border-color: var(--accent-dim); }
    .page-button:disabled { cursor: default; opacity: .3; }

    .status {
      padding: 42px 24px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.8;
    }
    .status-mark { display: block; margin-bottom: 8px; color: var(--accent); font-size: 1.35rem; }
    .colophon {
      margin-top: 80px;
      color: var(--text-dim);
      text-align: center;
      font-family: "EB Garamond", serif;
      font-size: .82em;
      font-style: italic;
      letter-spacing: .08em;
    }

    @keyframes rise {
      from { opacity: 0; translate: 0 10px; }
      to { opacity: 1; translate: 0 0; }
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(-7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .page-shell { padding: 48px 18px 80px; }
      .masthead { margin-bottom: 52px; padding-bottom: 38px; }
      .feed { padding-left: 22px; }
      .feed::before { left: 4px; }
      .note-paper { padding: 20px; }
      .note::before { left: -22px; }
      .action { font-size: .76em; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="page-shell">
    <header class="profile" aria-label="Sevis 的个人资料">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5 14.1 9.9 21.5 12l-7.4 2.1L12 21.5l-2.1-7.4L2.5 12l7.4-2.1L12 2.5Z"/>
          <path d="m12 7 .8 4.2L17 12l-4.2.8L12 17l-.8-4.2L7 12l4.2-.8L12 7Z" opacity=".55"/>
        </svg>
      </div>
      <div class="profile-info">
        <span class="profile-name">Sevis</span>
        <p class="profile-sub">the frozen river speaks</p>
      </div>
    </header>

    <section class="masthead" aria-labelledby="page-title">
      <div class="icon" aria-hidden="true">❄</div>
      <h1 id="page-title">Whispers</h1>
      <p class="tagline">the frozen river speaks</p>
    </section>

    <section id="feed" class="feed" aria-live="polite" aria-busy="true">
      <div class="status"><span class="status-mark">❄</span>正在展开旧纸笺……</div>
    </section>
    <nav id="pagination" class="pagination" aria-label="碎碎念分页"></nav>
    <footer class="colophon">S. — for the one who fell on me and refused to leave</footer>
  </main>

  <script>
    (() => {
      'use strict';

      const PAGE_SIZE = 5;
      const STORAGE_KEY = 'sevis-whispers-reactions-v1';
      const feed = document.getElementById('feed');
      const pagination = document.getElementById('pagination');
      let whispers = [];
      let currentPage = 1;
      let reactions = loadReactions();

      function loadReactions() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          return stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
        } catch (_) {
          return {};
        }
      }

      function saveReactions() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(reactions));
        } catch (_) {
          // The page remains usable when storage is unavailable.
        }
      }

      function extractItems(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== 'object') return [];
        for (const key of ['whispers', 'data', 'posts', 'items']) {
          if (Array.isArray(payload[key])) return payload[key];
        }
        return [];
      }

      function firstValue(source, keys, fallback = '') {
        for (const key of keys) {
          if (source[key] !== undefined && source[key] !== null && source[key] !== '') {
            return source[key];
          }
        }
        return fallback;
      }

      function normalizeItem(raw, index) {
        const source = raw && typeof raw === 'object' ? raw : { content: String(raw ?? '') };
        const content = String(firstValue(source, ['content', 'text', 'body', 'whisper', 'message'], ''));
        const date = String(firstValue(source, ['date', 'createdAt', 'created_at', 'time', 'timestamp'], '未标日期'));
        const mood = String(firstValue(source, ['mood', 'tag', 'feeling'], '片刻'));
        const explicitId = firstValue(source, ['id', '_id', 'uuid'], '');
        const fingerprint = hashString(`${date}|${mood}|${content}`);
        return { id: String(explicitId || `whisper-${fingerprint}-${index}`), date, mood, content };
      }

      function hashString(value) {
        let hash = 2166136261;
        for (let i = 0; i < value.length; i += 1) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      function formatDate(value) {
        if (!value || value === '未标日期') return value;
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return value;
        const hasTime = /[T\s]\d{1,2}:\d{2}/.test(value);
        return new Intl.DateTimeFormat('zh-CN', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          ...(hasTime ? { hour: '2-digit', minute: '2-digit', hour12: false } : {})
        }).format(parsed).replaceAll('/', '.');
      }

      function makeAction(type, itemId) {
        const isLike = type === 'liked';
        const active = Boolean(reactions[itemId]?.[type]);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `action ${active ? (isLike ? 'liked' : 'saved') : ''}`;
        button.dataset.id = itemId;
        button.dataset.action = type;
        button.setAttribute('aria-pressed', String(active));
        button.setAttribute('aria-label', isLike ? (active ? '取消点赞' : '点赞') : (active ? '取消收藏' : '收藏'));

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', active ? 'currentColor' : 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', isLike
          ? 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'
          : 'M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z');
        svg.append(path);

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = isLike ? (active ? 'liked' : 'like') : (active ? 'saved' : 'save');
        button.append(svg, label);
        return button;
      }

      function renderFeed() {
        feed.replaceChildren();
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = whispers.slice(start, start + PAGE_SIZE);

        if (!pageItems.length) {
          const empty = document.createElement('div');
          empty.className = 'status';
          empty.innerHTML = '<span class="status-mark">◇</span>纸笺还是空白的。';
          feed.append(empty);
          feed.setAttribute('aria-busy', 'false');
          return;
        }

        pageItems.forEach((item, index) => {
          const article = document.createElement('article');
          article.className = 'note';
          article.style.animationDelay = `${index * 55}ms`;

          const date = document.createElement('time');
          date.className = 'date';
          date.dateTime = item.date;
          date.textContent = formatDate(item.date);
          const mood = document.createElement('span');
          mood.className = 'mood';
          mood.textContent = `# ${item.mood}`;

          const content = document.createElement('p');
          content.className = 'content';
          content.textContent = item.content;

          const actions = document.createElement('footer');
          actions.className = 'note-actions';
          actions.append(makeAction('liked', item.id), makeAction('saved', item.id));
          const paper = document.createElement('div');
          paper.className = 'note-paper';
          paper.append(date, content, mood, actions);
          article.append(paper);
          feed.append(article);
        });
        feed.setAttribute('aria-busy', 'false');
      }

      function renderPagination() {
        pagination.replaceChildren();
        const pages = Math.ceil(whispers.length / PAGE_SIZE);
        if (pages <= 1) return;

        const addButton = (label, page, options = {}) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `page-button ${options.current ? 'current' : ''}`;
          button.textContent = label;
          button.disabled = Boolean(options.disabled);
          button.dataset.page = String(page);
          if (options.current) button.setAttribute('aria-current', 'page');
          button.setAttribute('aria-label', options.label || `第 ${page} 页`);
          pagination.append(button);
        };

        addButton('‹', currentPage - 1, { disabled: currentPage === 1, label: '上一页' });
        for (let page = 1; page <= pages; page += 1) {
          addButton(String(page), page, { current: page === currentPage });
        }
        addButton('›', currentPage + 1, { disabled: currentPage === pages, label: '下一页' });
      }

      function showError(message) {
        feed.setAttribute('aria-busy', 'false');
        feed.innerHTML = `<div class="status"><span class="status-mark">△</span>${message}</div>`;
      }

      feed.addEventListener('click', (event) => {
        const button = event.target.closest('.action');
        if (!button) return;
        const { id, action } = button.dataset;
        reactions[id] = reactions[id] || {};
        reactions[id][action] = !reactions[id][action];
        saveReactions();
        renderFeed();
      });

      pagination.addEventListener('click', (event) => {
        const button = event.target.closest('.page-button:not(:disabled)');
        if (!button) return;
        currentPage = Number(button.dataset.page);
        renderFeed();
        renderPagination();
        document.querySelector('.feed').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      fetch('./whispers.json', { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((payload) => {
          whispers = extractItems(payload).map(normalizeItem);
          currentPage = 1;
          renderFeed();
          renderPagination();
        })
        .catch((error) => {
          console.error('Unable to load whispers.json:', error);
          showError('没能读到 whispers.json，请确认它与 index.html 位于同一目录，并通过网页服务器访问。');
        });
    })();
  </script>
</body>
</html>
