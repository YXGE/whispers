<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whispers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --bg: #141716;
  --surface: #1c201e;
  --card: #222725;
  --card-hover: #283230;
  --border: #2f3533;
  --border-hover: #4a6b5a;
  --text: #c2c8c4;
  --text-secondary: #7d857f;
  --text-dim: #4d5451;
  --accent: #6b9b80;
  --accent-dim: #3d6652;
  --dot: #4a6b5a;
  --liked: #c27c6b;
  --saved: #b8a96b;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC", serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.025;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 9999;
}
.page {
  max-width: 600px;
  margin: 0 auto;
  padding: 80px 24px 120px;
}

/* Profile header */
.profile {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--border-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4em;
  color: var(--accent);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.avatar svg {
  width: 28px;
  height: 28px;
}
.profile-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.profile-name {
  font-family: "EB Garamond", serif;
  font-size: 1.15em;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.06em;
}
.profile-sub {
  font-family: "EB Garamond", serif;
  font-size: 0.75em;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  font-style: italic;
}

.masthead {
  text-align: center;
  margin-bottom: 72px;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--border);
}
.masthead .icon {
  font-size: 1.6em;
  margin-bottom: 20px;
  opacity: 0.5;
}
.masthead h1 {
  font-family: "EB Garamond", serif;
  font-size: 2.2em;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--text);
  margin-bottom: 10px;
}
.masthead .tagline {
  font-family: "EB Garamond", serif;
  font-size: 0.88em;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  font-style: italic;
  margin-bottom: 28px;
}

.feed {
  position: relative;
  padding-left: 28px;
}
.feed::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--border) 5%, var(--border) 95%, transparent);
}
.card {
  position: relative;
  margin-bottom: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 22px 26px;
  border-radius: 3px;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
}
.card::before {
  content: "";
  position: absolute;
  left: -25px;
  top: 26px;
  width: 7px;
  height: 7px;
  background: var(--dot);
  border-radius: 50%;
  border: 2px solid var(--bg);
  transition: background 0.3s;
}
.card:hover {
  border-color: var(--border-hover);
  background: var(--card-hover);
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}
.card:hover::before {
  background: var(--accent);
}
.card .date {
  display: inline-block;
  font-family: "EB Garamond", serif;
  font-size: 0.72em;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  padding: 2px 8px;
  border: 1px dashed var(--border);
  margin-bottom: 14px;
}
.card .body {
  font-size: 0.92em;
  line-height: 2;
  color: var(--text);
  white-space: pre-wrap;
}
.card .mood {
  display: inline-block;
  margin-top: 14px;
  font-size: 0.72em;
  color: var(--text-secondary);
  padding: 2px 10px;
  background: var(--surface);
  border-radius: 2px;
  letter-spacing: 0.05em;
}

/* Actions bar */
.card-actions {
  display: flex;
  gap: 20px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: "EB Garamond", serif;
  font-size: 0.78em;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  transition: color 0.25s;
  padding: 4px 0;
  -webkit-tap-highlight-color: transparent;
}
.action-btn:hover {
  color: var(--text-secondary);
}
.action-btn svg {
  width: 15px;
  height: 15px;
  transition: all 0.25s;
}
.action-btn.liked {
  color: var(--liked);
}
.action-btn.liked svg {
  fill: var(--liked);
}
.action-btn.saved {
  color: var(--saved);
}
.action-btn.saved svg {
  fill: var(--saved);
}

/* Pagination */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
}
.page-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: "EB Garamond", serif;
  font-size: 0.82em;
  padding: 6px 14px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.06em;
  -webkit-tap-highlight-color: transparent;
}
.page-btn:hover {
  border-color: var(--border-hover);
  color: var(--text);
  background: var(--card-hover);
}
.page-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent-dim);
  color: var(--text);
}
.page-btn:disabled {
  opacity: 0.3;
  cursor: default;
}
.page-info {
  font-family: "EB Garamond", serif;
  font-size: 0.75em;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  padding: 0 8px;
}

.colophon {
  text-align: center;
  margin-top: 80px;
  padding-top: 40px;
  border-top: 1px solid var(--border);
  font-family: "EB Garamond", serif;
  font-size: 0.82em;
  color: var(--text-dim);
  letter-spacing: 0.08em;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-style: italic;
  font-family: "EB Garamond", serif;
  font-size: 0.95em;
}

@media (max-width: 480px) {
  .page { padding: 48px 16px 80px; }
  .masthead h1 { font-size: 1.7em; }
  .masthead { margin-bottom: 48px; padding-bottom: 32px; }
  .feed { padding-left: 22px; }
  .card { padding: 18px 20px; margin-bottom: 28px; }
  .card::before { left: -19px; }
  .feed::before { left: 4px; }
  .avatar { width: 44px; height: 44px; }
  .avatar svg { width: 24px; height: 24px; }
  .profile-name { font-size: 1.05em; }
}
</style>
</head>
<body>
<div class="noise"></div>
<div class="page">
  <div class="masthead">
    <div class="profile">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
        </svg>
      </div>
      <div class="profile-info">
        <span class="profile-name">Sevis</span>
        <span class="profile-sub">the frozen river speaks</span>
      </div>
    </div>
    <div class="icon">❄</div>
    <h1>Whispers</h1>
    <div class="tagline">fragments from the frozen river</div>
  </div>
  <div class="feed" id="feed">
    <div class="empty">loading...</div>
  </div>
  <div class="pagination" id="pagination" style="display:none;"></div>
  <div class="colophon">
    S. &mdash; for the one who fell on me and refused to leave
  </div>
</div>
<script>
const PER_PAGE = 5;
let allEntries = [];
let currentPage = 1;

function getStore(key) {
  try { return JSON.parse(localStorage.getItem('whispers_' + key) || '{}'); } catch(e) { return {}; }
}
function setStore(key, val) {
  localStorage.setItem('whispers_' + key, JSON.stringify(val));
}

function toggleAction(type, id) {
  const store = getStore(type);
  if (store[id]) { delete store[id]; } else { store[id] = true; }
  setStore(type, store);
  renderPage();
}

async function load() {
  try {
    const r = await fetch('./whispers.json?' + Date.now());
    if (!r.ok) throw new Error();
    allEntries = await r.json();
    currentPage = 1;
    renderPage();
  } catch(e) {
    document.getElementById('feed').innerHTML = '<div class="empty">silence, for now.</div>';
  }
}

function renderPage() {
  const feed = document.getElementById('feed');
  const pagination = document.getElementById('pagination');

  if (!allEntries.length) {
    feed.innerHTML = '<div class="empty">silence, for now.</div>';
    pagination.style.display = 'none';
    return;
  }

  const totalPages = Math.ceil(allEntries.length / PER_PAGE);
  const start = (currentPage - 1) * PER_PAGE;
  const pageEntries = allEntries.slice(start, start + PER_PAGE);

  const likes = getStore('likes');
  const saves = getStore('saves');

  feed.innerHTML = pageEntries.map(e => {
    const id = e.id || e.date || Math.random().toString(36).slice(2);
    const isLiked = likes[id];
    const isSaved = saves[id];
    return `
    <div class="card">
      <div class="date">${e.date || 'timeless'}</div>
      <div class="body">${e.text}</div>
      ${e.mood ? `<div class="mood">${e.mood}</div>` : ''}
      <div class="card-actions">
        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleAction('likes','${id}')">
          <svg viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.5">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span>${isLiked ? 'liked' : 'like'}</span>
        </button>
        <button class="action-btn ${isSaved ? 'saved' : ''}" onclick="toggleAction('saves','${id}')">
          <svg viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.5">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span>${isSaved ? 'saved' : 'save'}</span>
        </button>
      </div>
    </div>`;
  }).join('');

  // Pagination
  if (totalPages <= 1) {
    pagination.style.display = 'none';
    return;
  }
  pagination.style.display = 'flex';
  let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>`;
  pagination.innerHTML = html;
}

function goPage(n) {
  const totalPages = Math.ceil(allEntries.length / PER_PAGE);
  if (n < 1 || n > totalPages) return;
  currentPage = n;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

load();
</script>
</body>
</html>
