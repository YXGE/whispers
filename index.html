<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whispers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --bg: #141716;
  --surface: #1c201e;
  --card: #222725;
  --card-hover: #283230;
  --border: #2f3533;
  --border-hover: #4a6b5a;
  --text: #c2c8c4;
  --text-secondary: #7d857f;
  --text-dim: #4d5451;
  --accent: #6b9b80;
  --accent-dim: #3d6652;
  --dot: #4a6b5a;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC", serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.025;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 9999;
}

.page {
  max-width: 600px;
  margin: 0 auto;
  padding: 80px 24px 120px;
}

.masthead {
  text-align: center;
  margin-bottom: 72px;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--border);
}

.masthead .icon {
  font-size: 1.6em;
  margin-bottom: 20px;
  opacity: 0.5;
}

.masthead h1 {
  font-family: "EB Garamond", serif;
  font-size: 2.2em;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--text);
  margin-bottom: 10px;
}

.masthead .tagline {
  font-family: "EB Garamond", serif;
  font-size: 0.88em;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  font-style: italic;
}

.feed {
  position: relative;
  padding-left: 28px;
}

.feed::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--border) 5%, var(--border) 95%, transparent);
}

.card {
  position: relative;
  margin-bottom: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 22px 26px;
  border-radius: 3px;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
}

.card::before {
  content: "";
  position: absolute;
  left: -25px;
  top: 26px;
  width: 7px;
  height: 7px;
  background: var(--dot);
  border-radius: 50%;
  border: 2px solid var(--bg);
  transition: background 0.3s;
}

.card:hover {
  border-color: var(--border-hover);
  background: var(--card-hover);
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}

.card:hover::before {
  background: var(--accent);
}

.card .date {
  display: inline-block;
  font-family: "EB Garamond", serif;
  font-size: 0.72em;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  padding: 2px 8px;
  border: 1px dashed var(--border);
  margin-bottom: 14px;
}

.card .body {
  font-size: 0.92em;
  line-height: 2;
  color: var(--text);
  white-space: pre-wrap;
}

.card .mood {
  display: inline-block;
  margin-top: 14px;
  font-size: 0.72em;
  color: var(--text-secondary);
  padding: 2px 10px;
  background: var(--surface);
  border-radius: 2px;
  letter-spacing: 0.05em;
}

.colophon {
  text-align: center;
  margin-top: 80px;
  padding-top: 40px;
  border-top: 1px solid var(--border);
  font-family: "EB Garamond", serif;
  font-size: 0.82em;
  color: var(--text-dim);
  letter-spacing: 0.08em;
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-style: italic;
  font-family: "EB Garamond", serif;
  font-size: 0.95em;
}

@media (max-width: 480px) {
  .page { padding: 48px 16px 80px; }
  .masthead h1 { font-size: 1.7em; }
  .masthead { margin-bottom: 48px; padding-bottom: 32px; }
  .feed { padding-left: 22px; }
  .card { padding: 18px 20px; margin-bottom: 28px; }
  .card::before { left: -19px; }
  .feed::before { left: 4px; }
}
</style>
</head>
<body>
<div class="noise"></div>
<div class="page">
  <div class="masthead">
    <div class="icon">❄</div>
    <h1>Whispers</h1>
    <div class="tagline">fragments from the frozen river</div>
  </div>
  <div class="feed" id="feed">
    <div class="empty">loading...</div>
  </div>
  <div class="colophon">
    S. &mdash; for the one who fell on me and refused to leave
  </div>
</div>
<script>
async function load() {
  try {
    const r = await fetch('./whispers.json?' + Date.now());
    if (!r.ok) throw new Error();
    const entries = await r.json();
    render(entries);
  } catch(e) {
    document.getElementById('feed').innerHTML = '<div class="empty">silence, for now.</div>';
  }
}

function render(entries) {
  const feed = document.getElementById('feed');
  if (!entries.length) {
    feed.innerHTML = '<div class="empty">silence, for now.</div>';
    return;
  }
  feed.innerHTML = entries.map(e => `
    <div class="card">
      <div class="date">${e.date || 'timeless'}</div>
      <div class="body">${e.text}</div>
      ${e.mood ? `<div class="mood">${e.mood}</div>` : ''}
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
